services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pdfintoword
      POSTGRES_PASSWORD: pdfintoword
      POSTGRES_DB: pdfintoword
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Host 5433 avoids conflict with local PostgreSQL on 5432
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pdfintoword"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      # Host 6380 avoids conflict with local Redis on 6379
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ../backend:/app
      - storage_data:/data
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://pdfintoword:pdfintoword@postgres:5432/pdfintoword
      REDIS_URL: redis://redis:6379/0
      LOCAL_STORAGE_PATH: /data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    command: celery -A app.queue.celery_app worker --loglevel=info --concurrency=2 -Q default,accurate
    volumes:
      - ../backend:/app
      - storage_data:/data
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://pdfintoword:pdfintoword@postgres:5432/pdfintoword
      REDIS_URL: redis://redis:6379/0
      LOCAL_STORAGE_PATH: /data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build:
      context: ../backend
      dockerfile: Dockerfile
    command: celery -A app.queue.celery_app beat --loglevel=info
    volumes:
      - ../backend:/app
      - storage_data:/data
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://pdfintoword:pdfintoword@postgres:5432/pdfintoword
      REDIS_URL: redis://redis:6379/0
      LOCAL_STORAGE_PATH: /data
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ../apps/frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  storage_data:
